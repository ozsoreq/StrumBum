name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Pitch engine (pytest + benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "engine[dev]"
      - run: pytest -q
        working-directory: engine
      - run: python -m devtools.benchmark
        working-directory: engine

  android:
    name: Android (unit tests, APK, AAB)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy's buildPython must match the app's Python version (3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STRUMBUM_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "STRUMBUM_STOREFILE=release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          STRUMBUM_STOREPASSWORD: ${{ secrets.STRUMBUM_STORE_PASSWORD }}
          STRUMBUM_KEYALIAS: ${{ secrets.STRUMBUM_KEY_ALIAS }}
          STRUMBUM_KEYPASSWORD: ${{ secrets.STRUMBUM_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          ARGS=""
          [ -n "$ADMOB_APP_ID" ] && ARGS="$ARGS -Pstrumbum.admobAppId=$ADMOB_APP_ID"
          [ -n "$ADMOB_BANNER_ID" ] && ARGS="$ARGS -Pstrumbum.admobBannerId=$ADMOB_BANNER_ID"
          ./gradlew $ARGS testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: strumbum-builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab
